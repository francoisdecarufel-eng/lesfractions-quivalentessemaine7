<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Laboratoire des Fractions d'Halloween</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Polices Google -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Configuration Tailwind pour les couleurs et polices personnalisées -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'spooky': ['Creepster', 'cursive'],
                        'sans': ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        halloween: {
                            orange: '#ff6600',
                            purple: '#6b21a8',
                            dark: '#0f172a',
                            green: '#22c55e',
                            slime: '#a3e635'
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: white; margin: 0; padding: 0; overflow-x: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 102, 0, 0.3); }
        .item-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Style des boutons fantômes/citrouilles désélectionnés */
        .grayscale-item { filter: grayscale(100%) opacity(0.5); transition: all 0.2s; }
        .color-item { filter: grayscale(0%) opacity(1); transform: scale(1.1); transition: all 0.2s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        
        // --- DONNÉES DES NIVEAUX ---
        const COLLECTION_LEVELS = [
            { id: 1, num: 1, den: 4, total: 24, emoji: '🎃', name: 'citrouilles' },
            { id: 2, num: 2, den: 5, total: 15, emoji: '👻', name: 'fantômes' },
            { id: 3, num: 1, den: 3, total: 18, emoji: '🦇', name: 'chauves-souris' },
            { id: 4, num: 3, den: 4, total: 12, emoji: '🕸️', name: 'toiles' },
            { id: 5, num: 1, den: 2, total: 20, emoji: '🕷️', name: 'araignées' }
        ];

        const PROBLEM_LEVELS = [
            {
                id: 1,
                title: "Le festin de bonbons",
                text: "Sur la table il y a 36 bonbons. Elhyon a très faim et il en mange la moitié (1/2). Landen, pour sa part, en mange le 1/6 et Maiden mange le reste.",
                total: 36,
                emoji: '🍬',
                actors: [
                    { id: 1, name: "Elhyon (1/2)", fractionText: "1/2", color: "bg-orange-500", target: 18, den: 2 },
                    { id: 2, name: "Landen (1/6)", fractionText: "1/6", color: "bg-purple-500", target: 6, den: 6 },
                    { id: 3, name: "Maiden (Le reste)", fractionText: "Le reste", color: "bg-green-500", target: 12, den: 1 }
                ],
                explanation: [
                    "Elhyon : 1/2 de 36 bonbons. On coupe en 2 parts égales : 36 ÷ 2 = 18 bonbons.",
                    "Landen : 1/6 de 36 bonbons. On coupe en 6 parts égales : 36 ÷ 6 = 6 bonbons.",
                    "Maiden : Elle prend ce qu'il reste. 36 au total - 18 (Elhyon) - 6 (Landen) = 12 bonbons restants."
                ]
            },
            {
                id: 2,
                title: "Les potions magiques",
                text: "Une sorcière a préparé 24 potions magiques. Elle en donne 1/3 aux monstres, 1/4 aux vampires et elle garde le reste pour elle.",
                total: 24,
                emoji: '🧪',
                actors: [
                    { id: 1, name: "Monstres (1/3)", fractionText: "1/3", color: "bg-blue-500", target: 8, den: 3 },
                    { id: 2, name: "Vampires (1/4)", fractionText: "1/4", color: "bg-red-500", target: 6, den: 4 },
                    { id: 3, name: "Sorcière (Le reste)", fractionText: "Le reste", color: "bg-purple-600", target: 10, den: 1 }
                ],
                explanation: [
                    "Monstres : 1/3 de 24. 24 ÷ 3 = 8 potions.",
                    "Vampires : 1/4 de 24. 24 ÷ 4 = 6 potions.",
                    "Sorcière : Reste. 24 - 8 - 6 = 10 potions."
                ]
            },
            {
                id: 3,
                title: "Le champ de citrouilles",
                text: "Dans le champ, il y a 30 citrouilles. 1/5 sont sculptées pour faire peur, 2/5 sont sculptées pour faire rire, et le reste n'est pas encore sculpté.",
                total: 30,
                emoji: '🎃',
                actors: [
                    { id: 1, name: "Font peur (1/5)", fractionText: "1/5", color: "bg-red-700", target: 6, den: 5 },
                    { id: 2, name: "Font rire (2/5)", fractionText: "2/5", color: "bg-yellow-500", target: 12, den: 5 },
                    { id: 3, name: "Non sculptées", fractionText: "Le reste", color: "bg-emerald-600", target: 12, den: 1 }
                ],
                explanation: [
                    "Pour faire peur : 1/5 de 30. 30 ÷ 5 = 6 citrouilles.",
                    "Pour faire rire : 2/5 de 30. Un cinquième c'est 6, donc deux cinquièmes c'est 6 × 2 = 12 citrouilles.",
                    "Non sculptées : Reste. 30 - 6 - 12 = 12 citrouilles."
                ]
            }
        ];

        const SIMULATION_LEVELS = [
            { id: 1, num: 1, den: 4, total: 24, emoji: '🎃', name: 'citrouilles' },
            { id: 2, num: 2, den: 5, total: 15, emoji: '👻', name: 'fantômes' },
            { id: 3, num: 3, den: 4, total: 12, emoji: '🦇', name: 'chauves-souris' }
        ].map(level => {
            const numberOfPackets = level.total / level.den;
            const targetCount = numberOfPackets * level.num;

            return {
                ...level,
                numberOfPackets,
                steps: [
                    { title: "Introduction", text: `Observons ensemble comment trouver ${level.num}/${level.den} de ${level.total} ${level.name}. Voici notre collection bien organisée.` },
                    { title: "Étape 1 : Le Dénominateur", text: `Le dénominateur est ${level.den}. Sans changer l'organisation, nous créons des paquets de ${level.den} objets ! Nous obtenons donc ${numberOfPackets} paquets égaux.` },
                    { title: "Étape 2 : Le Numérateur", text: `Le numérateur est ${level.num}. Nous allons sélectionner magiquement ${level.num} objet(s) DANS CHAQUE paquet !` },
                    { title: "Étape 3 : Le Résultat", text: `Comptons ! Nous avons sélectionné ${level.num} objet(s) dans chacun de nos ${numberOfPackets} paquets. ${level.num} × ${numberOfPackets} = ${targetCount}. Donc, ${level.num}/${level.den} de ${level.total} = ${targetCount} !` }
                ]
            };
        });

        const AutoSimulator = ({ level, onNextLevel }) => {
            const [currentStep, setCurrentStep] = React.useState(0);

            React.useEffect(() => {
                setCurrentStep(0);
            }, [level]);

            const nextStep = () => {
                if (currentStep < level.steps.length - 1) {
                    setCurrentStep(prev => prev + 1);
                }
            };

            const prevStep = () => {
                if (currentStep > 0) {
                    setCurrentStep(prev => prev - 1);
                }
            };

            const stepData = level.steps[currentStep];
            const isFinished = currentStep === level.steps.length - 1;
            const isGrouped = currentStep > 0;

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6">
                    <div className="text-center w-full space-y-2">
                        <h2 className="text-3xl md:text-5xl font-spooky text-halloween-slime tracking-wider">
                            La Boule de Cristal
                        </h2>
                        
                        {/* Boîte d'explication de l'étape courante */}
                        <div className="bg-gray-800 p-6 rounded-xl border-l-4 border-halloween-slime shadow-lg mt-4 min-h-[120px] flex flex-col justify-center transition-all duration-300 item-enter" key={currentStep}>
                            <h3 className="text-2xl font-bold text-halloween-slime mb-2">{stepData.title}</h3>
                            <p className="text-xl md:text-2xl text-white">{stepData.text}</p>
                        </div>
                    </div>

                    {/* Zone Visuelle Animée */}
                    <div className="glass-panel p-6 rounded-2xl w-full max-w-4xl relative min-h-[350px] flex items-center justify-center overflow-hidden">
                        
                        {/* Grille stable : Les objets restent à la même place, on ajoute simplement des cadres pour illustrer les paquets */}
                        <div className="flex flex-col gap-2 md:gap-4 w-full item-enter items-center pt-2">
                            {Array.from({ length: level.numberOfPackets }).map((_, packetIdx) => {
                                return (
                                    <div key={`packet-${packetIdx}`} 
                                         className={`relative flex flex-row items-center justify-center p-2 md:p-3 rounded-xl transition-all duration-700
                                         ${!isGrouped 
                                            ? 'border-transparent bg-transparent' // Étape 0 : Grille simple, aucune démarcation
                                            : 'border-2 border-halloween-orange/60 bg-gray-900/60 shadow-[0_0_10px_rgba(255,102,0,0.1)]' // Étape 1+ : Les rangées deviennent des paquets visibles
                                         }`}>

                                       {/* Objets à l'intérieur du paquet */}
                                       <div className="flex flex-row gap-2 md:gap-6">
                                           {Array.from({ length: level.den }).map((_, itemIdx) => {
                                               // Est-ce que cet objet spécifique dans le paquet est ciblé par le numérateur ?
                                               const isItemSelected = currentStep >= 2 && itemIdx < level.num;
                                               
                                               let itemClass = "";
                                               if (!isGrouped) {
                                                   itemClass = "color-item"; // Étape 0
                                               } else if (currentStep === 1) {
                                                   itemClass = "color-item scale-95 opacity-80"; // Étape 1 : Montre juste les groupes
                                               } else {
                                                   // Étapes 2 & 3 : Sélection active
                                                   if (isItemSelected) {
                                                       itemClass = "color-item drop-shadow-[0_0_15px_rgba(163,230,53,0.9)] scale-125 z-10";
                                                   } else {
                                                       itemClass = "grayscale-item opacity-30 scale-75";
                                                   }
                                               }

                                               return (
                                                   <div key={`item-${packetIdx}-${itemIdx}`} 
                                                        className={`text-3xl md:text-5xl transition-all duration-500 flex items-center justify-center ${itemClass}`}>
                                                       {level.emoji}
                                                   </div>
                                               );
                                           })}
                                       </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Boutons de navigation des étapes */}
                    <div className="flex flex-wrap justify-center gap-4 w-full">
                        <button onClick={prevStep} disabled={currentStep === 0} className={`font-bold py-3 px-6 rounded-full shadow-lg border-b-4 transition-all text-lg ${currentStep === 0 ? 'bg-gray-700 text-gray-500 cursor-not-allowed border-gray-800' : 'bg-gray-600 hover:bg-gray-500 text-white border-gray-700 active:border-b-0 active:translate-y-1'}`}>
                            ⬅️ Revenir en arrière
                        </button>
                        
                        {!isFinished ? (
                            <button onClick={nextStep} className="bg-halloween-slime hover:bg-green-500 text-gray-900 font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(163,230,53,0.5)] border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all animate-pulse-fast text-lg">
                                Étape suivante ➡️
                            </button>
                        ) : (
                            <button onClick={onNextLevel} className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all text-lg">
                                Simulation suivante ➡️
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const CollectionSimulator = ({ level, onNextLevel }) => {
            const [selected, setSelected] = React.useState(new Set());
            const [showExp, setShowExp] = React.useState(false);
            const [isSuccess, setIsSuccess] = React.useState(false);
            const [isGrouped, setIsGrouped] = React.useState(false);
            
            const targetCount = (level.total / level.den) * level.num;
            const numberOfPackets = level.total / level.den;

            // Réinitialiser l'état quand le niveau change
            React.useEffect(() => {
                setSelected(new Set());
                setShowExp(false);
                setIsSuccess(false);
                setIsGrouped(false); // Réinitialiser le groupement
            }, [level]);

            // Vérifier la victoire à chaque clic
            React.useEffect(() => {
                if (selected.size === targetCount) {
                    setIsSuccess(true);
                } else {
                    setIsSuccess(false);
                }
            }, [selected, targetCount]);

            const toggleSelection = (index) => {
                if (!isGrouped) return; // Empêche la sélection avant d'avoir fait les paquets
                if (isSuccess && !showExp) return; // Empêche de modifier après victoire
                
                const newSelected = new Set(selected);
                if (newSelected.has(index)) {
                    newSelected.delete(index);
                } else {
                    if (newSelected.size < targetCount + 5) {
                        newSelected.add(index);
                    }
                }
                setSelected(newSelected);
            };

            const handleShowAnswer = () => {
                setIsGrouped(true); // Force le groupement si l'élève demande la réponse
                const answerSet = new Set();
                
                // Sélectionne 'num' objets dans chaque paquet
                for (let p = 0; p < numberOfPackets; p++) {
                    for (let i = 0; i < level.num; i++) {
                        answerSet.add(p * level.den + i); // Calcule l'index global
                    }
                }
                setSelected(answerSet);
            };

            return (
                <div className="flex flex-col items-center w-full max-w-4xl mx-auto space-y-6">
                    <div className="text-center space-y-2">
                        <h2 className="text-3xl md:text-5xl font-spooky text-halloween-orange tracking-wider">
                            Mission : Les Collections
                        </h2>
                        <p className="text-xl md:text-2xl">
                            Trouve <strong className="text-halloween-slime text-3xl font-bold bg-gray-800 px-2 rounded">{level.num}/{level.den}</strong> de {level.total} {level.name}.
                        </p>
                        <p className="text-gray-400 italic text-sm">
                            {isGrouped 
                                ? `Astuce : Sélectionne ${level.num} élément(s) dans chaque paquet !` 
                                : `Commence par diviser la collection en paquets avec le dénominateur (${level.den}).`}
                        </p>
                    </div>

                    {/* Zone de la grille interactive */}
                    <div className="glass-panel p-6 rounded-2xl w-full max-w-3xl relative min-h-[350px]">
                        {isSuccess && !showExp && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-70 rounded-2xl z-10 backdrop-blur-sm">
                                <h3 className="text-5xl font-spooky text-halloween-green animate-bounce mb-4">BRAVO !</h3>
                                <p className="text-2xl text-white">Tu as trouvé {targetCount} {level.emoji}</p>
                                <div className="mt-6 flex space-x-4">
                                    <button onClick={() => setShowExp(true)} className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform transform hover:scale-105">
                                        Voir les explications
                                    </button>
                                    <button onClick={onNextLevel} className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform transform hover:scale-105">
                                        Niveau suivant ➡️
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Affichage adaptatif selon l'état de groupement */}
                        {!isGrouped ? (
                            <div className="flex flex-col items-center justify-center space-y-8 py-4">
                                <div className="flex flex-wrap justify-center gap-3 p-4 max-w-2xl">
                                    {Array.from({ length: level.total }).map((_, idx) => (
                                        <div key={idx} className="text-3xl md:text-5xl grayscale-item opacity-60">
                                            {level.emoji}
                                        </div>
                                    ))}
                                </div>
                                <button 
                                    onClick={() => setIsGrouped(true)}
                                    className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-4 px-8 rounded-full shadow-[0_0_20px_rgba(255,102,0,0.6)] border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all animate-bounce text-xl"
                                >
                                    🪄 Faire {numberOfPackets} paquets de {level.den}
                                </button>
                            </div>
                        ) : (
                            <div className="flex flex-col gap-4 items-center pt-2">
                                {Array.from({ length: numberOfPackets }).map((_, packetIdx) => (
                                    <div key={`packet-${packetIdx}`} className="border-2 border-halloween-orange/60 bg-gray-900/60 shadow-[0_0_10px_rgba(255,102,0,0.1)] p-3 rounded-xl flex flex-row gap-4 md:gap-6 item-enter">
                                        {Array.from({ length: level.den }).map((_, itemIdx) => {
                                            const globalIdx = packetIdx * level.den + itemIdx;
                                            const isSelected = selected.has(globalIdx);
                                            return (
                                                <button 
                                                    key={`item-${globalIdx}`}
                                                    onClick={() => toggleSelection(globalIdx)}
                                                    className={`text-3xl md:text-5xl transition-all duration-300 hover:scale-125 focus:outline-none ${isSelected ? 'color-item drop-shadow-[0_0_15px_rgba(163,230,53,0.9)] scale-125 z-10' : 'grayscale-item opacity-40 hover:opacity-100 hover:scale-110'}`}
                                                >
                                                    {level.emoji}
                                                </button>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {isGrouped && (
                            <div className="mt-6 flex justify-between items-center text-lg font-bold border-t border-gray-700 pt-4">
                                <span>Sélection : <span className={selected.size === targetCount ? "text-halloween-green" : "text-white"}>{selected.size}</span></span>
                                <span>Cible : {targetCount}</span>
                            </div>
                        )}
                    </div>

                    {/* Boutons d'action en bas */}
                    <div className="flex flex-wrap justify-center gap-4 w-full">
                        <button onClick={handleShowAnswer} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-lg border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 transition-all">
                            Voir la réponse 💡
                        </button>
                        <button onClick={() => setShowExp(!showExp)} className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-full shadow-lg border-b-4 border-purple-800 active:border-b-0 active:translate-y-1 transition-all">
                            {showExp ? "Cacher les explications" : "Voir les explications 📖"}
                        </button>
                        <button onClick={onNextLevel} className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-2 px-6 rounded-full shadow-lg border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all">
                            Passer au niveau suivant ➡️
                        </button>
                    </div>

                    {/* Panneau d'explication mathématique mis à jour */}
                    {showExp && (
                        <div className="glass-panel p-6 rounded-2xl w-full max-w-3xl mt-4 border-l-8 border-l-purple-500 item-enter">
                            <h3 className="text-2xl font-bold text-purple-300 mb-4">Le grimoire des explications</h3>
                            <p className="mb-2 text-lg">Pour trouver <strong>{level.num}/{level.den}</strong> de <strong>{level.total}</strong> :</p>
                            <ul className="list-disc pl-6 space-y-2 text-lg">
                                <li><strong>Étape 1 :</strong> On fait des petits paquets avec le dénominateur ({level.den}). <br/>
                                    <span className="bg-gray-800 px-2 py-1 rounded text-halloween-orange font-mono font-bold">{level.total} ÷ {level.den} = {numberOfPackets} paquets</span><br/>
                                    <span className="text-sm text-gray-300">Nous obtenons visuellement {numberOfPackets} paquets de {level.den} {level.name}.</span>
                                </li>
                                <li><strong>Étape 2 :</strong> Le numérateur est {level.num}, donc on choisit {level.num} objet(s) DANS CHAQUE paquet. <br/>
                                    <span className="bg-gray-800 px-2 py-1 rounded text-halloween-orange font-mono font-bold">{numberOfPackets} paquets × {level.num} = {targetCount}</span>
                                </li>
                            </ul>
                            <div className="mt-4 p-4 bg-gray-900 rounded-lg text-center">
                                <p className="font-bold text-xl text-halloween-green">
                                    Réponse : {targetCount} {level.emoji}
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ProblemSimulator = ({ level, onNextLevel }) => {
            // État pour savoir à qui on assigne l'objet
            const [activeActorId, setActiveActorId] = React.useState(null); // Modifié : Commence sans aucune sélection
            // Tableau stockant l'ID de l'acteur assigné à chaque objet (null par défaut)
            const [assignments, setAssignments] = React.useState(Array(level.total).fill(null));
            const [showExp, setShowExp] = React.useState(false);
            const [isSuccess, setIsSuccess] = React.useState(false);

            React.useEffect(() => {
                setAssignments(Array(level.total).fill(null));
                setActiveActorId(null); // Réinitialiser la sélection de l'acteur à chaque niveau
                setShowExp(false);
                setIsSuccess(false);
            }, [level]);

            // Calculer les totaux actuels
            const currentCounts = level.actors.reduce((acc, actor) => {
                acc[actor.id] = assignments.filter(a => a === actor.id).length;
                return acc;
            }, {});

            // Vérifier la victoire
            React.useEffect(() => {
                let win = true;
                level.actors.forEach(actor => {
                    if (currentCounts[actor.id] !== actor.target) {
                        win = false;
                    }
                });
                // S'assurer que tous les éléments sont assignés
                if (assignments.includes(null)) win = false;
                
                setIsSuccess(win);
            }, [assignments, currentCounts, level]);

            const handleAssign = (index) => {
                if (isSuccess && !showExp) return;
                if (!activeActorId) return; // Empêche de colorier si aucun personnage n'est sélectionné

                const newAssignments = [...assignments];
                
                // Si on clique sur un objet déjà colorié par le personnage actif, on l'efface (toggle)
                if (newAssignments[index] === activeActorId) {
                    newAssignments[index] = null;
                } 
                // Si l'objet est vide, on le colorie
                else if (newAssignments[index] === null) {
                    newAssignments[index] = activeActorId;
                }
                // Si l'objet appartient à un autre personnage, on l'ignore pour ne pas effacer le travail précédent
                
                setAssignments(newAssignments);
            };

            const handleShowAnswer = () => {
                let newAssignments = [];
                level.actors.forEach(actor => {
                    for(let i=0; i < actor.target; i++) {
                        newAssignments.push(actor.id);
                    }
                });
                setAssignments(newAssignments);
            };

            const activeActor = level.actors.find(a => a.id === activeActorId);

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6">
                    <div className="text-center space-y-2">
                        <h2 className="text-3xl md:text-5xl font-spooky text-halloween-orange tracking-wider">
                            {level.title}
                        </h2>
                    </div>

                    {/* Zone de l'histoire */}
                    <div className="glass-panel p-6 rounded-2xl w-full text-lg md:text-xl font-medium leading-relaxed shadow-[0_0_20px_rgba(107,33,168,0.4)]">
                        <p>{level.text}</p>
                    </div>

                    {/* Zone de travail interactive (Grille en haut, Personnages en bas) */}
                    <div className="flex flex-col gap-8 w-full">
                        
                        {/* Zone de la grille d'objets */}
                        <div className="glass-panel p-6 rounded-2xl w-full relative min-h-[350px] flex flex-col items-center justify-start">
                            {isSuccess && !showExp && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-80 rounded-2xl z-20 backdrop-blur-sm">
                                    <h3 className="text-5xl font-spooky text-halloween-green animate-bounce mb-4">Merveilleux !</h3>
                                    <p className="text-xl text-white text-center px-4">La distribution est mathématiquement parfaite !</p>
                                    <div className="mt-6 flex flex-wrap justify-center gap-4">
                                        <button onClick={() => setShowExp(true)} className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-full shadow-lg">
                                            Voir la preuve
                                        </button>
                                        <button onClick={onNextLevel} className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-3 px-6 rounded-full shadow-lg">
                                            Problème suivant ➡️
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Consigne dynamique */}
                            <div className="text-center mb-6 min-h-[30px]">
                                {!activeActor ? (
                                    <span className="text-xl italic text-gray-300 font-semibold animate-pulse">
                                        Étape 1 : Clique sur une fraction (couleur) en bas pour créer tes ensembles !
                                    </span>
                                ) : (
                                    <span className="text-xl italic text-halloween-slime font-semibold drop-shadow-md">
                                        {activeActor.den > 1 
                                            ? `Étape 2 : Les objets sont entourés. Sélectionne le bon nombre d'objets dans chaque ensemble !` 
                                            : "Étape 2 : Sélectionne tout ce qu'il reste !"}
                                    </span>
                                )}
                            </div>

                            {/* Grille dynamique préservant la structure */}
                            <div className="flex flex-wrap justify-center items-center content-start gap-2 w-full max-w-4xl z-10">
                                {Array.from({ length: level.total / (activeActor ? activeActor.den : 1) }).map((_, groupIdx) => {
                                    // Le nombre d'items dans un cercle correspond au dénominateur du personnage actif
                                    const itemsPerGroup = activeActor ? activeActor.den : 1;
                                    const isGrouped = activeActor && activeActor.den > 1;

                                    return (
                                        <div key={groupIdx} 
                                             className={`flex flex-row flex-wrap gap-2 justify-center items-center transition-all duration-700
                                             ${isGrouped ? 'p-3 border-4 border-dashed rounded-[2rem] border-white/60 bg-white/5 shadow-[0_0_15px_rgba(255,255,255,0.15)]' : 'p-1 border-4 border-transparent'}`}>
                                            
                                            {Array.from({ length: itemsPerGroup }).map((_, itemIdx) => {
                                                const globalIdx = groupIdx * itemsPerGroup + itemIdx;
                                                const assignedId = assignments[globalIdx];
                                                const actor = level.actors.find(a => a.id === assignedId);
                                                const bgColor = actor ? actor.color : 'bg-gray-800 border-2 border-gray-600';
                                                const isAssigned = assignedId !== null;

                                                return (
                                                    <button
                                                        key={globalIdx}
                                                        onClick={() => handleAssign(globalIdx)}
                                                        className={`w-12 h-12 md:w-14 md:h-14 text-2xl md:text-3xl flex items-center justify-center rounded-full transition-all duration-300 shadow-md ${bgColor} hover:brightness-125 hover:scale-110 active:scale-95 ${!activeActor ? 'cursor-not-allowed opacity-80' : 'cursor-pointer'}`}
                                                    >
                                                        <span className={isAssigned ? 'opacity-100 scale-110' : 'opacity-40 grayscale'}>
                                                            {level.emoji}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Panneau du bas : Les personnages / Fractions */}
                        <div className="flex flex-wrap justify-center gap-4 w-full">
                            {level.actors.map(actor => {
                                const count = currentCounts[actor.id];
                                const isDone = count === actor.target;
                                const isOver = count > actor.target;
                                
                                return (
                                    <button 
                                        key={actor.id}
                                        onClick={() => setActiveActorId(actor.id)}
                                        className={`relative p-4 rounded-xl flex flex-col md:flex-row items-center gap-4 transition-all border-4 w-full md:w-auto min-w-[220px] shadow-lg
                                            ${activeActorId === actor.id ? 'border-white scale-110 shadow-[0_0_20px_rgba(255,255,255,0.6)] z-10' : 'border-transparent opacity-70 hover:opacity-100 hover:scale-105'} 
                                            ${actor.color}`}
                                    >
                                        <span className="font-bold text-white text-xl flex-grow text-center md:text-left">{actor.name}</span>
                                        <div className="bg-black/50 rounded-lg px-4 py-2 text-white font-mono font-bold flex gap-2 items-center text-xl">
                                            <span>{count} / {actor.target}</span>
                                            {isDone && <span className="text-halloween-slime drop-shadow-md text-2xl">✓</span>}
                                            {isOver && <span className="text-red-400 text-sm absolute -top-3 -right-3 bg-black rounded-full px-2 py-1 border border-red-500 animate-pulse">Trop!</span>}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Boutons d'action globaux */}
                    <div className="flex flex-wrap justify-center gap-4 w-full pt-4 border-t border-gray-700">
                        <button onClick={handleShowAnswer} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-lg border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 transition-all">
                            Voir la réponse 💡
                        </button>
                        <button onClick={() => setShowExp(!showExp)} className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-full shadow-lg border-b-4 border-purple-800 active:border-b-0 active:translate-y-1 transition-all">
                            {showExp ? "Cacher les explications" : "Voir les explications 📖"}
                        </button>
                        <button onClick={onNextLevel} className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-2 px-6 rounded-full shadow-lg border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all">
                            Passer au problème suivant ➡️
                        </button>
                    </div>

                    {/* Explications */}
                    {showExp && (
                        <div className="glass-panel p-6 rounded-2xl w-full border-l-8 border-l-halloween-green item-enter">
                            <h3 className="text-2xl font-bold text-halloween-green mb-4">Le parchemin magique (Explications)</h3>
                            <ul className="space-y-4">
                                {level.explanation.map((line, idx) => (
                                    <li key={idx} className="flex gap-4 items-start">
                                        <div className={`w-6 h-6 rounded-full mt-1 flex-shrink-0 ${level.actors[idx].color}`}></div>
                                        <p className="text-lg">{line}</p>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [mode, setMode] = React.useState('menu'); // 'menu', 'collection', 'problem', 'simulation'
            const [levelIndex, setLevelIndex] = React.useState(0);

            const handleStartCollection = () => {
                setLevelIndex(0);
                setMode('collection');
            };

            const handleStartProblems = () => {
                setLevelIndex(0);
                setMode('problem');
            };

            const handleStartSimulation = () => {
                setLevelIndex(0);
                setMode('simulation');
            };

            const nextCollectionLevel = () => {
                if (levelIndex < COLLECTION_LEVELS.length - 1) {
                    setLevelIndex(prev => prev + 1);
                } else {
                    setMode('menu'); // Retour au menu si terminé
                }
            };

            const nextProblemLevel = () => {
                if (levelIndex < PROBLEM_LEVELS.length - 1) {
                    setLevelIndex(prev => prev + 1);
                } else {
                    setMode('menu');
                }
            };

            const nextSimulationLevel = () => {
                if (levelIndex < SIMULATION_LEVELS.length - 1) {
                    setLevelIndex(prev => prev + 1);
                } else {
                    setMode('menu');
                }
            };

            return (
                <div className="min-h-screen relative font-sans">
                    {/* Décoration de fond CSS */}
                    <div className="fixed inset-0 pointer-events-none opacity-20" 
                         style={{
                             backgroundImage: 'radial-gradient(circle at 50% 50%, #6b21a8 0%, #0f172a 100%)',
                             zIndex: -1
                         }}>
                    </div>
                    
                    {/* En-tête */}
                    <header className="p-4 text-center bg-gray-900 border-b-2 border-halloween-orange shadow-lg relative flex items-center justify-center min-h-[100px]">
                        {mode !== 'menu' && (
                            <button 
                                onClick={() => setMode('menu')}
                                className="absolute left-4 top-1/2 transform -translate-y-1/2 bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white font-bold py-2 px-4 rounded-lg shadow-[0_0_15px_rgba(255,102,0,0.3)] transition-all z-50 flex items-center gap-2 cursor-pointer hover:scale-105 active:scale-95"
                                style={{ pointerEvents: 'auto' }}
                            >
                                <span className="text-xl">⬅️</span>
                                <span className="hidden md:inline">Retour au menu</span>
                            </button>
                        )}
                        <h1 className="text-4xl md:text-5xl text-white font-spooky tracking-widest drop-shadow-[0_0_10px_rgba(255,102,0,0.8)] z-10">
                            🦇 Fractions d'Halloween 🎃
                        </h1>
                    </header>

                    <main className="container mx-auto p-4 py-8 flex justify-center">
                        {mode === 'menu' && (
                            <div className="flex flex-col items-center space-y-8 mt-10 item-enter">
                                <h2 className="text-3xl text-white font-bold text-center">Choisis ton aventure mathématique</h2>
                                
                                {/* Modification de la grille de 2 colonnes à 3 colonnes pour inclure la simulation */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl w-full px-4">
                                    
                                    {/* Nouvelle tuile : Simulation */}
                                    <div className="glass-panel p-8 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-4 border-halloween-slime cursor-pointer group flex flex-col justify-between" onClick={handleStartSimulation}>
                                        <div>
                                            <div className="text-6xl mb-4 group-hover:animate-bounce-slow">🔮</div>
                                            <h3 className="text-2xl font-bold text-halloween-slime mb-2">La Boule de Cristal</h3>
                                            <p className="text-gray-300 mb-6">Regarde la magie opérer ! Une simulation étape par étape pour bien comprendre et visualiser les fractions.</p>
                                        </div>
                                        <button className="bg-halloween-slime hover:bg-green-400 text-gray-900 font-bold py-3 px-8 rounded-full w-full shadow-lg">Simuler</button>
                                    </div>

                                    <div className="glass-panel p-8 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-4 border-halloween-orange cursor-pointer group flex flex-col justify-between" onClick={handleStartCollection}>
                                        <div>
                                            <div className="text-6xl mb-4 group-hover:animate-bounce-slow">🎃</div>
                                            <h3 className="text-2xl font-bold text-halloween-orange mb-2">La Potion des Collections</h3>
                                            <p className="text-gray-300 mb-6">Pratique tes fractions d'un tout. Trouve 1/4 des citrouilles en les coloriant !</p>
                                        </div>
                                        <button className="bg-halloween-orange hover:bg-orange-400 text-white font-bold py-3 px-8 rounded-full w-full shadow-lg">Jouer</button>
                                    </div>

                                    <div className="glass-panel p-8 rounded-3xl text-center hover:scale-105 transition-transform duration-300 border-t-4 border-purple-500 cursor-pointer group flex flex-col justify-between" onClick={handleStartProblems}>
                                        <div>
                                            <div className="text-6xl mb-4 group-hover:animate-bounce-slow">🧙‍♀️</div>
                                            <h3 className="text-2xl font-bold text-purple-400 mb-2">Les Problèmes Monstrueux</h3>
                                            <p className="text-gray-300 mb-6">Aide les monstres à partager leurs trésors en lisant de petites histoires captivantes.</p>
                                        </div>
                                        <button className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-8 rounded-full w-full shadow-lg">Jouer</button>
                                    </div>

                                </div>
                            </div>
                        )}

                        {}
                        {mode === 'simulation' && (
                            <AutoSimulator 
                                level={SIMULATION_LEVELS[levelIndex]} 
                                onNextLevel={nextSimulationLevel} 
                            />
                        )}

                        {mode === 'collection' && (
                            <CollectionSimulator 
                                level={COLLECTION_LEVELS[levelIndex]} 
                                onNextLevel={nextCollectionLevel} 
                            />
                        )}

                        {mode === 'problem' && (
                            <ProblemSimulator 
                                level={PROBLEM_LEVELS[levelIndex]} 
                                onNextLevel={nextProblemLevel} 
                            />
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
